<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - MediQuick</title>
    <style>
        /* ==========================================
            Admin Settings Global & Layout Styles
            ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body.admin-body {
            background-color: #0d1527;
            color: #ffffff;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 260px;
            background-color: #0b0f19;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        .admin-brand {
            padding: 25px 20px;
            font-size: 1.2rem;
            border-bottom: 1px solid #1e293b;
        }

        .admin-brand span {
            color: #38bdf8;
        }

        .admin-nav ul {
            list-style: none;
            padding: 15px 10px;
        }

        .admin-nav li {
            margin-bottom: 5px;
        }

        .admin-nav a {
            display: block;
            padding: 12px 15px;
            color: #94a3b8;
            font-size: 0.95rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .admin-nav a:hover, .admin-nav a.active {
            background-color: #1e293b;
            color: #38bdf8;
        }

        .admin-logout {
            padding: 20px;
            border-top: 1px solid #1e293b;
        }

        .admin-logout a {
            color: #ef4444;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Main Content Area */
        .admin-main {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            background-color: #0d1527;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 1.8rem;
            color: #fff;
        }

        /* Card & Form Styles */
        .admin-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 700px;
        }

        .admin-card h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #fff;
        }

        .input-field {
            margin-bottom: 20px;
        }

        .input-field label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .admin-input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .admin-input:focus {
            border-color: #38bdf8;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-layout">
        <!-- Admin Sidebar[cite: 10] -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <h2>MediQuick <span>Admin</span></h2>
            </div>
            <nav class="admin-nav">
                <ul>
                    <li><a href="admin-dashboard.html">📊 Dashboard</a></li>
                    <li><a href="admin-orders.html">📦 Orders</a></li>
                    <li><a href="admin-inventory.html">💊 Inventory</a></li>
                    <li><a href="admin-prescriptions.html">📄 Prescriptions</a></li>
                    <li><a href="admin-consultations.html">🩺 Doctor Consultations</a></li>
                    <li><a href="admin-customers.html">👥 Customers</a></li>
                    <li><a href="admin-staff.html">👨‍⚕️ Staff</a></li>
                    <li><a href="admin-settings.html" class="active">⚙️ Settings</a></li>
                </ul>
            </nav>
            <div class="admin-logout">
                <a href="login.html">🚪 Logout</a>
            </div>
        </aside>

        <!-- Main Content[cite: 10] -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Platform Settings</h1>
            </header>

            <div class="admin-card">
                <h3>Store Information</h3>
                <form id="settingsForm">
                    <div class="input-field">
                        <label>Store Name</label>
                        <input type="text" id="settingsStoreName" value="MediQuick Online Pharmacy" class="admin-input" required>
                    </div>
                    <div class="input-field">
                        <label>Support Email</label>
                        <input type="email" id="settingsEmail" value="support@mediquick.com" class="admin-input" required>
                    </div>
                    <div class="input-field">
                        <label>Standard Delivery Fee (LKR)</label>
                        <input type="number" step="0.01" id="settingsDeliveryFee" value="350.00" class="admin-input" required>
                    </div>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </form>
            </div>
        </main>
    </div>

    <!-- JavaScript for Settings Management -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();

            const form = document.getElementById('settingsForm');
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const storeName = document.getElementById('settingsStoreName').value.trim();
                const supportEmail = document.getElementById('settingsEmail').value.trim();
                const deliveryFee = document.getElementById('settingsDeliveryFee').value.trim();

                const settingsData = {
                    storeName,
                    supportEmail,
                    deliveryFee
                };

                // Saving settings in LocalStorage
                localStorage.setItem('mediquick_settings', JSON.stringify(settingsData));
                alert('Settings saved successfully!');
            });
        });

        function loadSettings() {
            const savedSettings = JSON.parse(localStorage.getItem('mediquick_settings'));
            if (savedSettings) {
                if(savedSettings.storeName) document.getElementById('settingsStoreName').value = savedSettings.storeName;
                if(savedSettings.supportEmail) document.getElementById('settingsEmail').value = savedSettings.supportEmail;
                if(savedSettings.deliveryFee) document.getElementById('settingsDeliveryFee').value = savedSettings.deliveryFee;
            }
        }
    </script>
</body>
</html>
