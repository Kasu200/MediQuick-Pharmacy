<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQuick - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d1527;
            color: #ffffff;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #0b0f19;
            border-bottom: 1px solid #1e293b;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-links a.active, .nav-links a:hover {
            color: #38bdf8;
        }
        .cart-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #fff;
        }
        
        /* Cart Item Styles */
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111827;
            border: 1px solid #1e293b;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        .cart-item-title {
            font-weight: 600;
            font-size: 1rem;
        }
        .cart-item-price {
            color: #38bdf8;
            font-size: 0.9rem;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .qty-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            width: 24px;
            height: 24px;
        }
        .btn-remove {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .cart-summary {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-top: 25px;
        }
        .checkout-btn {
            background: #00e676;
            color: #000;
            padding: 12px 24px;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-size: 16px;
            transition: background 0.2s;
        }
        .checkout-btn:hover {
            background: #00c853;
        }
        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo" style="color: #fff; margin: 0;">MediQuick</h1>
            <ul class="nav-links">
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html" class="active">Cart</a></li>
                <li><a href="track-order.html">Track Order</a></li>
            </ul>
        </nav>
    </header>

    <main class="cart-container">
        <h2>Your Shopping Cart</h2>
        
        <div id="cart-items-list" style="margin-top: 20px;"></div>
        
        <div class="cart-summary">
            <h3 style="margin: 0;">Total: LKR <span id="cart-total-price">0.00</span></h3>
            <button class="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
        </div>
    </main>

    <script>
        // Sample fallback data if local storage is empty
        let cart = JSON.parse(localStorage.getItem('mediquick_cart')) || [
            {
                id: 1,
                name: "Advanced Multivitamin Daily Supplement",
                price: 2450.00,
                qty: 1,
                image: "imagesmultivitamin.jpeg"
            }
        ];

        function renderCart() {
            const listContainer = document.getElementById('cart-items-list');
            const totalElement = document.getElementById('cart-total-price');
            
            if (cart.length === 0) {
                listContainer.innerHTML = `<div class="empty-msg"><p>Your cart is empty.</p><a href="shop.html" style="color:#38bdf8;">Continue Shopping</a></div>`;
                totalElement.textContent = "0.00";
                return;
            }

            let html = '';
            let grandTotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                grandTotal += itemTotal;

                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.image}" alt="${item.name}" class="cart-item-img">
                            <div>
                                <div class="cart-item-title">${item.name}</div>
                                <div class="cart-item-price">LKR ${item.price.toLocaleString()}</div>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                            </div>
                            <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
            totalElement.textContent = grandTotal.toLocaleString('en-US', { minimumFractionDigits: 2 });
            
            // Save current cart state
            localStorage.setItem('mediquick_cart', JSON.stringify(cart));
        }

        function updateQty(index, change) {
            if (cart[index].qty + change > 0) {
                cart[index].qty += change;
            } else {
                cart.splice(index, 1);
            }
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            window.location.href = "checkout.html";
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
