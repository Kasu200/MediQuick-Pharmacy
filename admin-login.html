<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MediQuick</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1527; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { margin-bottom: 20px; color: #38bdf8; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cbd5e1; }
        input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 0.95rem; }
        button:hover { background: #1d4ed8; }
        .error { color: #f87171; font-size: 0.85rem; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Portal</h2>
        <form id="adminLoginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="adminUser" required placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPass" required placeholder="Enter password">
            </div>
            <button type="submit">Login</button>
            <p id="errorMsg" class="error"></p>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            //You can change 'admin' and 'mediquick123' here as you wish.
            if (user === 'admin' && pass === 'mediquick123') {
                // If successful, it saves the login status to local storage.
                localStorage.setItem('isAdminLoggedIn', 'true');
                
                // After logging in, you will be directed straight to admin-staff.html.
                window.location.href = 'admin-staff.html';
            } else {
                document.getElementById('errorMsg').textContent = 'Invalid Username or Password!';
            }
        });
    </script>
</body>
</html>
