<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescription Management - MediQuick Admin</title>
    <style>
        /* ==========================================
            Admin Prescriptions Global & Layout Styles
            ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body.admin-body {
            background-color: #0d1527;
            color: #ffffff;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 260px;
            background-color: #0b0f19;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        .admin-brand {
            padding: 25px 20px;
            font-size: 1.2rem;
            border-bottom: 1px solid #1e293b;
        }

        .admin-brand span {
            color: #38bdf8;
        }

        .admin-nav ul {
            list-style: none;
            padding: 15px 10px;
        }

        .admin-nav li {
            margin-bottom: 5px;
        }

        .admin-nav a {
            display: block;
            padding: 12px 15px;
            color: #94a3b8;
            font-size: 0.95rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .admin-nav a:hover, .admin-nav a.active {
            background-color: #1e293b;
            color: #38bdf8;
        }

        .admin-logout {
            padding: 20px;
            border-top: 1px solid #1e293b;
        }

        .admin-logout a {
            color: #ef4444;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Main Content Area */
        .admin-main {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            background-color: #0d1527;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 1.8rem;
            color: #fff;
        }

        .admin-user-profile span {
            background: #1e293b;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        /* Filters Bar */
        .admin-filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .admin-input, .admin-select {
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .admin-input {
            flex: 1;
        }

        .admin-input:focus, .admin-select:focus {
            border-color: #38bdf8;
        }

        /* Table Card */
        .admin-card {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .admin-table th, .admin-table td {
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }

        .admin-table th {
            background-color: #0f172a;
            color: #cbd5e1;
            font-weight: 600;
        }

        .admin-table td {
            color: #94a3b8;
        }

        /* Status Badges & Actions */
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .status-approved { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .status-rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .btn-action-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-view {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-view:hover {
            background: rgba(56, 189, 248, 0.3);
        }

        .status-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        /* Modal for Viewing Prescription Image */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0f172a;
            padding: 25px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            color: #fff;
            border: 1px solid #1e293b;
            text-align: center;
        }

        .modal-content img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 6px;
            margin: 15px 0;
            border: 1px solid #334155;
        }

        .btn-close-modal {
            background: #334155;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-layout">
        <!-- Admin Sidebar[cite: 9] -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <h2>MediQuick <span>Admin</span></h2>
            </div>
            <nav class="admin-nav">
                <ul>
                    <li><a href="admin-dashboard.html">📊 Dashboard</a></li>
                    <li><a href="admin-orders.html">📦 Orders</a></li>
                    <li><a href="admin-inventory.html">💊 Inventory</a></li>
                    <li><a href="admin-prescriptions.html" class="active">📄 Prescriptions</a></li>
                    <li><a href="admin-consultations.html">🩺 Doctor Consultations</a></li>
                    <li><a href="admin-customers.html">👥 Customers</a></li>
                    <li><a href="admin-staff.html">👨‍⚕️ Staff</a></li>
                    <li><a href="admin-settings.html">⚙️ Settings</a></li>
                </ul>
            </nav>
            <div class="admin-logout">
                <a href="login.html">🚪 Logout</a>
            </div>
        </aside>

        <!-- Main Content[cite: 9] -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Prescription Management</h1>
                <div class="admin-user-profile">
                    <span>Pharmacist Panel</span>
                </div>
            </header>

            <!-- Filters Bar[cite: 9] -->
            <div class="admin-filter-bar">
                <input type="text" id="rxSearch" placeholder="Search by Patient Name or Rx ID..." class="admin-input" oninput="filterPrescriptions()">
                <select id="rxStatusFilter" class="admin-select" onchange="filterPrescriptions()">
                    <option value="all">All Statuses</option>
                    <option value="Pending">Pending Review</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>

            <!-- Prescriptions Table[cite: 9] -->
            <div class="admin-card">
                <table class="admin-table" id="rxTable">
                    <thead>
                        <tr>
                            <th>Rx ID</th>
                            <th>Patient Name</th>
                            <th>Upload Date</th>
                            <th>Contact</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminRxTableBody">
                        <!-- Dynamically added via JS[cite: 9] -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal to View Prescription Image -->
    <div id="rxModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Prescription Details</h3>
            <img id="modalRxImage" src="" alt="Prescription Image">
            <p id="modalRxNotes" style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px;"></p>
            <button class="btn-close-modal" onclick="closeRxModal()">Close</button>
        </div>
    </div>

    <!-- JavaScript for Prescriptions Management -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPrescriptions();
        });

        function loadPrescriptions() {
            const prescriptions = JSON.parse(localStorage.getItem('mediquick_prescriptions')) || [];
            displayPrescriptions(prescriptions);
        }

        function displayPrescriptions(rxList) {
            const tbody = document.getElementById('adminRxTableBody');
            tbody.innerHTML = '';

            if (rxList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="no-data">No medical prescriptions were found.</td></tr>`;
                return;
            }

            rxList.forEach((rx, originalIndex) => {
                const rxId = rx.id || `#RX-${1000 + originalIndex}`;
                const patientName = rx.patientName || rx.name || 'Unknown Patient';
                const uploadDate = rx.date ? new Date(rx.date).toLocaleDateString() : 'N/A';
                const contact = rx.contact || rx.phone || 'N/A';
                const status = rx.status || 'Pending';

                let statusClass = 'status-pending';
                if (status === 'Approved') statusClass = 'status-approved';
                else if (status === 'Rejected') statusClass = 'status-rejected';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${rxId}</td>
                    <td>${patientName}</td>
                    <td>${uploadDate}</td>
                    <td>${contact}</td>
                    <td><span class="status-badge ${statusClass}">${status}</span></td>
                    <td>
                        <div class="btn-action-group">
                            <button class="btn-view" onclick='viewPrescription(${JSON.stringify(rx)})'>View</button>
                            <select class="status-select" onchange="updateRxStatus(${originalIndex}, this.value)">
                                <option value="Pending" ${status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Approved" ${status === 'Approved' ? 'selected' : ''}>Approved</option>
                                <option value="Rejected" ${status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                            </select>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function viewPrescription(rx) {
            const modal = document.getElementById('rxModal');
            const img = document.getElementById('modalRxImage');
            const notes = document.getElementById('modalRxNotes');

            img.src = rx.image || rx.imageUrl || '';
            notes.textContent = `Notes: ${rx.notes || rx.description || 'No additional notes provided.'}`;
            modal.style.display = 'flex';
        }

        function closeRxModal() {
            document.getElementById('rxModal').style.display = 'none';
        }

        function updateRxStatus(index, newStatus) {
            let prescriptions = JSON.parse(localStorage.getItem('mediquick_prescriptions')) || [];
            if (prescriptions[index]) {
                prescriptions[index].status = newStatus;
                localStorage.setItem('mediquick_prescriptions', JSON.stringify(prescriptions));
                loadPrescriptions();
            }
        }

        function filterPrescriptions() {
            const query = document.getElementById('rxSearch').value.toLowerCase();
            const statusFilter = document.getElementById('rxStatusFilter').value;
            const prescriptions = JSON.parse(localStorage.getItem('mediquick_prescriptions')) || [];

            const filtered = prescriptions.filter((rx, index) => {
                const rxId = (rx.id || `#RX-${1000 + index}`).toLowerCase();
                const name = (rx.patientName || rx.name || '').toLowerCase();
                const status = rx.status || 'Pending';

                const matchesQuery = rxId.includes(query) || name.includes(query);
                const matchesStatus = statusFilter === 'all' || status === statusFilter;

                return matchesQuery && matchesStatus;
            });

            displayPrescriptions(filtered);
        }
    </script>
</body>
</html>
