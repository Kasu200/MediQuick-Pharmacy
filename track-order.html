<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - MediQuick</title>
    <style>
        /* ==========================================
            Track Order Global & Layout Styles
            ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1527;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header / Navbar */
        .main-header {
            background-color: #0b0f19;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }

        .logo span {
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #94a3b8;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #38bdf8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-icon {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #334155;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #fff;
        }

        .btn-secondary:hover {
            border-color: #38bdf8;
        }

        /* Page Title Banner */
        .page-title-banner {
            background: linear-gradient(135deg, #0b0f19 0%, #1e293b 100%);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }

        .page-title-banner h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .page-title-banner p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Form & Container Styles */
        .about-section {
            padding: 50px 20px;
            flex: 1;
        }

        .track-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 600px;
            margin: 0 auto;
        }

        .admin-input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .admin-input:focus {
            border-color: #38bdf8;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        /* Result Box Style */
        .status-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .status-box h3 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        /* Footer */
        .main-footer {
            background-color: #0b0f19;
            border-top: 1px solid #1e293b;
            padding: 30px 20px;
            text-align: center;
            margin-top: auto;
        }

        .main-footer p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar[cite: 11] -->
    <header class="main-header">
        <div class="container navbar">
            <a href="index.html" class="logo">Medi<span>Quick</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="track-order.html" class="active">Track Order</a>
                <a href="contact.html">Contact Us</a>
            </nav>
            <div class="header-actions">
                <a href="cart.html" class="cart-icon">🛒 Cart (<span class="cart-badge">0</span>)</a>
                <a href="login.html" class="btn-secondary">Login</a>
            </div>
        </div>
    </header>

    <!-- Page Title Banner[cite: 11] -->
    <section class="page-title-banner">
        <div class="container">
            <h1>Track Your Order</h1>
            <p>Enter your Order ID to check the real-time delivery status[cite: 11].</p>
        </div>
    </section>

    <!-- Track Order Form Container[cite: 11] -->
    <section class="about-section container">
        <div class="track-card">
            <form id="track-order-form">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.85rem;">Order ID *</label>
                    <input type="text" id="trackOrderId" placeholder="e.g. MQ-84920" class="admin-input" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.85rem;">Phone Number / Email *</label>
                    <input type="text" id="trackPhone" placeholder="Enter phone or email used for order" class="admin-input" required>
                </div>
                <button type="submit" class="btn-primary">Check Status</button>
            </form>

            <!-- Order Result Box[cite: 11] -->
            <div id="order-status-result"></div>
        </div>
    </section>

    <!-- Footer[cite: 11] -->
    <main-footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 MediQuick. All rights reserved[cite: 11].</p>
        </div>
    </main-footer>

    <script src="script.js"></script>
    <script>
        document.getElementById('track-order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const orderIdInput = document.getElementById('trackOrderId').value.trim().toLowerCase();
            const contactInput = document.getElementById('trackPhone').value.trim().toLowerCase();
            const resultBox = document.getElementById('order-status-result');

            // Retrieving order data from LocalStorage (data saved via admin-orders or checkout)
            const orders = JSON.parse(localStorage.getItem('mediquick_orders')) || [];

            // Some dummy data can also be added for traditional testing.
            const foundOrder = orders.find(ord => {
                const idMatch = (ord.id || ord.orderId || '').toLowerCase().includes(orderIdInput);
                const contactMatch = (ord.phone || ord.email || '').toLowerCase().includes(contactInput);
                return idMatch && contactMatch;
            });

            if (foundOrder) {
                resultBox.innerHTML = `
                    <div class="status-box">
                        <h3>Order Found!</h3>
                        <p><strong>Order ID:</strong> ${foundOrder.id || foundOrder.orderId}</p>
                        <p><strong>Status:</strong> <span style="color: #34d399; font-weight: bold;">${foundOrder.status || 'Processing'}</span></p>
                        <p><strong>Total Amount:</strong> LKR ${foundOrder.total || foundOrder.amount || 'N/A'}</p>
                        <p style="margin-top: 10px; font-size: 0.85rem; color: #94a3b8;">Your order is being handled safely and will reach you soon.</p>
                    </div>
                `;
            } else {
                // Show when nothing is found
                resultBox.innerHTML = `
                    <div class="status-box" style="border-color: #ef4444;">
                        <h3 style="color: #f87171;">Order Not Found</h3>
                        <p style="font-size: 0.9rem; color: #cbd5e1;">No order was found matching the provided details. Please check if the Order ID and phone number are correct.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
