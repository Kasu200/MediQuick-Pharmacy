<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MediQuick</title>
    
    <style>
        /* ==========================================
            Global Styles & Gradient Background
            ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /*Background style (gradient) similar to the Login and Register pages */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #cbd5e1 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Wrapper Container */
        .forgot-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex: 1;
        }

        .auth-card {
            background: #0b132b;
            padding: 40px 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #1e293b;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 8px;
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 600;
        }

        .auth-subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Input Fields with Icons */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        /* Action Button */
        .auth-btn {
            background: #2563eb;
            color: #ffffff;
            padding: 14px;
            border: none;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .auth-btn:hover {
            background: #1d4ed8;
        }

        /* Back to Login Link */
        .auth-switch {
            margin-top: 22px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .auth-switch a {
            color: #38bdf8;
            font-weight: 600;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        /* Bottom Footer Links */
        .simple-footer {
            display: flex;
            gap: 25px;
            font-size: 0.8rem;
            color: #475569;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .simple-footer a {
            color: #475569;
            transition: color 0.2s;
        }

        .simple-footer a:hover {
            color: #94a3b8;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Forgot Password Container -->
    <div class="forgot-wrapper">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="auth-subtitle" id="form-subtitle">Enter your registered email address to reset your password.</p>

            <form id="forgotPasswordForm">
                <div class="input-group" id="email-field-group">
                    <span>✉️</span>
                    <input type="email" id="resetEmail" placeholder="user@example.com" required>
                </div>

                <button type="submit" class="auth-btn" id="submit-btn">Send Reset Link</button>
            </form>

            <p class="auth-switch"><a href="login.html">← Back to Log In</a></p>
        </div>
    </div>

    <!-- Bottom Footer Links -->
    <div class="simple-footer">
        <span>© 2026 MediQuick Healthcare Inc.</span>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
        <a href="help.html">Help Center</a>
    </div>

    <!-- JavaScript for Handling Password Reset Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgotPasswordForm');
            let resetStep = 1; // Step 1: Enter email, Step 2: Set a new password
            let targetUserEmail = '';

            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();

                    let users = JSON.parse(localStorage.getItem('mediquick_users')) || [];
                    
                    const singleUser = JSON.parse(localStorage.getItem('mediquick_user'));
                    if (singleUser && users.length === 0) {
                        users.push(singleUser);
                    }

                    if (resetStep === 1) {
                        // Step 1: Verifying the email address
                        const emailInput = document.getElementById('resetEmail').value.trim();
                        
                        const userFound = users.find(u => u.email === emailInput);

                        if (!userFound) {
                            alert('No account was found associated with this email address. Please enter a valid email address.');
                            return;
                        }

                        targetUserEmail = emailInput;
                        resetStep = 2;

                        // Allowing the form to be modified to enter a new password.
                        const inputGroup = document.getElementById('email-field-group');
                        inputGroup.innerHTML = `
                            <span>🔒</span>
                            <input type="password" id="newPassword" placeholder="Enter New Password" required>
                        `;

                        document.getElementById('form-subtitle').textContent = 'Account verified. Please enter your new password.';
                        document.getElementById('submit-btn').textContent = 'Update Password';

                    } else if (resetStep === 2) {
                        // Step 2: Saving the new password
                        const newPasswordInput = document.getElementById('newPassword').value;

                        if (!newPasswordInput || newPasswordInput.length < 4) {
                            alert('Please enter a valid password (it must be at least 4 characters long)..');
                            return;
                        }

                        // Updating the relevant user's password
                        users = users.map(u => {
                            if (u.email === targetUserEmail) {
                                u.password = newPasswordInput;
                            }
                            return u;
                        });

                        // Updating LocalStorage
                        localStorage.setItem('mediquick_users', JSON.stringify(users));

                        // Updating the single user object, if it exists.
                        const singleUser = JSON.parse(localStorage.getItem('mediquick_user'));
                        if (singleUser && singleUser.email === targetUserEmail) {
                            singleUser.password = newPasswordInput;
                            localStorage.setItem('mediquick_user', JSON.stringify(singleUser));
                        }

                        alert('Password successfully changed! You can now log in using the new password..');
                        window.location.href = 'login.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
